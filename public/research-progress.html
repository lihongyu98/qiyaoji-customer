<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七钥纪 · 研究推进看板</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#071722;color:#c7dce4}*{box-sizing:border-box}body{margin:0}main{max-width:1260px;margin:auto;padding:32px 24px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #345166;padding-bottom:20px}h1{font-size:28px;color:#e6cc91;margin:8px 0}h2{font-size:18px;color:#83d1d5}h3{color:#e4d4aa;margin:10px 0;font-size:16px}p{line-height:1.8;margin:8px 0}a{color:#83d1d5}button{background:#163747;border:1px solid #426778;border-radius:5px;color:#d5e7eb;padding:10px 16px;cursor:pointer}.muted{color:#8eafbd;font-size:13px}.status{padding:18px 22px;background:#102d3d;border-left:4px solid #68ccd0;border-radius:6px;margin:22px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.step,.log{border:1px solid #2d4c60;border-radius:8px;padding:18px;background:#0c2433}.metric b{display:block;color:#e4c782;font-size:27px}.metric span{font-size:13px}.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.step{border-top:3px solid #3e5969}.step[data-state=done]{border-top-color:#6acbbb}.step[data-state=active]{border-top-color:#e7bd65}.step[data-state=waiting]{opacity:.8}.badge{font-size:11px;color:#7dd2cf;letter-spacing:1px}.step p{font-size:13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.log{margin:12px 0}.log p{font-size:14px}.stamp{color:#91b5c4;font-size:12px}.rollback{border-left:3px solid #dbaf6e;padding-left:14px}.error{color:#edb48c}#update{font-variant-numeric:tabular-nums}@media(max-width:750px){main{padding:20px 14px}header{align-items:flex-start;flex-direction:column}.metrics,.road{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}h1{font-size:25px}}
</style><link rel="stylesheet" href="/workspace.css"><script type="application/qiyaoji-deferred">window.QIYAOJI_LOCAL_APP=true;window.QIYAOJI_CUSTOMER_APP=true;window.WM_LOCAL_PDF=false;</script></head><body><a href="world-model-tree.html">世界模型知识大树</a><main><header><div><div class="badge">QIYAOJI · RESEARCH LOG</div><h1>小步推进，每一步都有依据</h1><p class="muted">完成、验证、退回调整，再进入下一步。</p></div><div><button id="refresh" type="button">立即刷新</button><p><a href="research-round2.html">第二批20篇全文档案</a> · <a href="index.html">进入学习工作台</a> · <a href="assets/research20/campaign.json" target="_blank" rel="noopener">查看20篇档案JSON</a></p></div></header><div id="status" role="status" aria-live="polite" class="status">正在读取本地进度…</div><p id="update" class="muted"></p><section id="metrics" class="metrics" aria-label="可核实的工作量"></section><h2>研究路线 · 不用百分比冒充成果</h2><section id="road" class="road"></section><div class="columns"><section><h2>最近的小步</h2><div id="events"></div></section><section><h2>退回与调整</h2><div id="rollbacks"></div><h2>推进约束</h2><div id="gates" class="log"></div></section></div><p class="muted">每15秒检查一次进度文件。刷新页面不会执行训练；本地代码与线上部署分开记录。聊天执行结束后，看板不会自行继续研究。</p></main><script type="application/qiyaoji-deferred">
'use strict';const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};let pending=false;
async function refresh(){if(pending)return;pending=true;try{const r=await fetch('research-progress.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.schema!==1||!Array.isArray(d.steps))throw new Error('进度格式不匹配');document.getElementById('status').replaceChildren(node('strong',d.status),node('p',d.current));document.getElementById('update').textContent='记录更新：'+d.updated_at+' · 数据刷新：'+new Date().toLocaleTimeString('zh-CN')+' · '+d.deployment;const metrics=document.getElementById('metrics');metrics.replaceChildren();for(const m of d.metrics){const card=node('div',undefined,'metric');card.append(node('b',m.value),node('span',m.label));metrics.append(card);}const road=document.getElementById('road');road.replaceChildren();for(const s of d.steps){const card=node('article',undefined,'step');card.dataset.state=s.state;card.append(node('span',s.state==='done'?'✓ 已完成':s.state==='active'?'● 正在做':'○ 待推进','badge'),node('h3',s.title),node('p',s.result));if(s.accept)card.append(node('p',s.accept,'muted'));if(s.fallback)card.append(node('p',s.fallback,'muted'));if(s.evidence){const a=node('a','查看依据');if(!s.evidence.includes('..')&&!s.evidence.includes(':')){a.href=s.evidence;a.target='_blank';a.rel='noopener';card.append(a);}}road.append(card);}for(const [id,items]of [['events',d.events],['rollbacks',d.rollbacks]]){const box=document.getElementById(id);box.replaceChildren();for(const item of items){const card=node('article',undefined,'log'+(id==='rollbacks'?' rollback':''));card.append(node('span',item.time,'stamp'),node('h3',item.title),node('p',item.result));box.append(card);}}const gates=document.getElementById('gates');gates.replaceChildren();for(const t of d.gates)gates.append(node('p','• '+t));}catch(error){document.getElementById('status').replaceChildren(node('strong','进度暂未刷新','error'),node('p','请通过本地HTTP入口打开；已显示的内容可能是上一次记录。'));}finally{pending=false;}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh();},15000);
</script><script type="application/qiyaoji-deferred" src="/model-ui.js"></script><script type="application/qiyaoji-deferred" src="/customer-shell.js"></script><script type="application/qiyaoji-deferred" src="/guided-study.js"></script><script type="application/qiyaoji-deferred" src="/realm.js"></script><script type="application/qiyaoji-deferred" src="/expedition.js"></script><script type="application/qiyaoji-deferred" src="/workspace.js"></script><script type="application/qiyaoji-deferred" src="/voices.js"></script><script type="application/qiyaoji-deferred" src="/entrance.js"></script><script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script><script src="/customer-config.js"></script><script src="/customer-boot.js"></script></body></html>
