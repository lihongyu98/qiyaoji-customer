:root{color-scheme:dark;font:16px system-ui,"Microsoft YaHei",sans-serif;background:#091b28;color:#d2e3eb}*{box-sizing:border-box}body{margin:0}main{max-width:1140px;margin:auto;padding:28px 22px 70px}h1,h2,h3{color:#e8c98f}h1{font-size:32px;line-height:1.5}p{line-height:1.9}a{color:#8cdbd8}nav,.metrics,.flow,.filters{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}nav a,button{padding:10px 14px;border:1px solid #496477;border-radius:7px;color:#e3cd9f;background:#153444;text-decoration:none;font:inherit;cursor:pointer}.metrics span,.flow span{padding:14px 18px;border:1px solid #36596b;background:#0d2b3b;border-radius:8px}.notice{padding:18px 22px;border-left:4px solid #d7b56d;background:#133444;margin:24px 0}.muted{color:#9cb7c6;font-size:13px}.grid,.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card,.key,details{border:1px solid #365668;background:#0d2838;border-radius:9px;padding:18px}.card h3{margin-top:0}.badge{color:#8ee0cf;font-size:13px}.pending{color:#d7b98a}summary{cursor:pointer;color:#e1ca9e}details{margin:14px 0}q{display:block;line-height:1.8;color:#a6dcdb;padding:8px}code{overflow-wrap:anywhere}input{padding:12px;border:1px solid #47697b;border-radius:6px;background:#112f40;color:#e4eff2;font:inherit;min-width:200px;flex:1}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #e6bd72;outline-offset:3px}section{margin-top:30px}@media(max-width:680px){main{padding:20px 14px}.grid,.keys{grid-template-columns:1fr}h1{font-size:26px}}

<p class="muted">QIYAOJI · RESEARCH POSITIONING</p><h1>把“宏观与骡”变成可检验的研究问题</h1>
<p>CV × PyTorch × VLA：面向决策的视觉世界模型。</p>
<div id="app" role="status">正在读取研究定位与真实进度…</div>
</main><script type="application/qiyaoji-deferred">
'use strict';
const el=(t,s,c)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;if(c)n.className=c;return n;};
const para=(p,s,c)=>p.append(el('p',s,c));
const link=(p,label,url)=>{const a=el('a',label);const u=new URL(url,location.href);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}};
const button=(s,fn)=>{const b=el('button',s);b.type='button';b.onclick=fn;return b;};
let pack;const app=document.getElementById('app');
function home(){app.replaceChildren();const pos=pack.positioning,a=pack.audit,m=el('div',undefined,'metrics');
 for(const s of [`精读完成 ${a.completed} / ${a.selected}`,`原文备齐 ${a.downloaded} / ${a.selected}`,`${a.keys}项七钥 · ${a.anchors}处定位`,`${a.cards_used}卡时 · ${a.author_models_run}次模型运行`])m.append(el('span',s));app.append(m);
 const note=el('div',undefined,'notice');note.append(el('strong',pack.status));para(note,'已完成的七钥由助手填写，不计入你的掌握度或游戏奖励。本轮17篇补读与3篇新选均有阅读范围。仅本地，线上未更新。');app.append(note);
 const ledger=el('section');ledger.append(el('h2','综述对照：判断如何修正'));for(const d of pack.reasoning_changes){const c=el('details');c.append(el('summary',d.before));para(c,'新证据：'+d.evidence);para(c,'修正：'+d.after);para(c,'待验证：'+d.test);para(c,'退回：'+d.retreat,'muted');ledger.append(c);}para(ledger,'这是可检查的分析过程修正，不能证明模型权重、通用能力或新任务泛化发生进化。');for(const s of pack.surveys){link(ledger,s.id,s.source);para(ledger,'定向复核PDF页：'+s.read_pages.join('、')+'；综述不计入20篇。','muted');}app.append(ledger); app.append(el('h2',pos.headline));para(app,pos.question);para(app,pos.judgment);para(app,pos.basis,'muted');
 const f=el('div',undefined,'flow');for(const s of ['① 观测是否可辨','② 表示保留了什么','③ 动力学是否使用','④ 动作是否改善'])f.append(el('span',s));app.append(f);para(app,pos.example);
 const fit=el('div',undefined,'grid');for(const d of pos.fit){const c=el('article',undefined,'card');c.append(el('span',d.fit,'badge'),el('h3',d.direction));para(c,d.reason);fit.append(c);}app.append(fit);
 const prior=el('details');prior.append(el('summary','查新边界：哪些想法已有先例'));for(const d of pos.prior_art){prior.append(el('h3',d.name));para(prior,d.finding);para(prior,d.scope,'muted');link(prior,'核对来源',d.source);}app.append(prior);
 const base=el('details');base.append(el('summary','复现起点与工程门槛'));for(const d of pos.baselines){base.append(el('h3',d.name+' · '+d.role));para(base,d.evidence);para(base,d.risk,'muted');link(base,'作者代码',d.source);}app.append(base);
 const plan=el('details');plan.append(el('summary','最小实验：每一步的推进与退回条件'));for(const d of pos.experiment){plan.append(el('h3',d.stage));para(plan,d.action);para(plan,'退回条件：'+d.retreat,'muted');}para(plan,pos.compute);app.append(plan);para(app,pos.publication);
 app.append(el('h2','新增20篇 · 按证据记录阅读进度'));para(app,pack.scope,'muted');const filter=el('div',undefined,'filters'),input=el('input');input.type='search';input.placeholder='搜索论文或选读理由';input.setAttribute('aria-label','搜索第三批论文');filter.append(input);app.append(filter);const grid=el('div',undefined,'grid');app.append(grid);
 function render(){grid.replaceChildren();const q=input.value.toLowerCase();for(const p of pack.papers.filter(x=>(x.name+' '+x.reason).toLowerCase().includes(q))){const c=el('article',undefined,'card'),done=p.status==='main_and_relevant_appendix_read';c.append(el('span',done?'已完成七钥复核':p.status==='partial_read'?'部分审读 · 不计完成':'待精读',done?'badge':'badge pending'),el('h3',p.id+' · '+p.name));para(c,p.reason);para(c,`${p.year} · ${p.page_count}页PDF`,'muted');if(done)c.append(button('七钥 · 原文定位 · 理解自答',()=>paper(p)));else{para(c,p.read_scope||'原文已下载并核验指纹，尚未填写精读答案。','muted');link(c,'原始PDF',p.source);}grid.append(c);}if(!grid.children.length)para(grid,'没有匹配论文。');}input.oninput=render;render();
 const changes=el('details');changes.append(el('summary','筛选自检与核验说明'));para(changes,'本轮计数：补齐17篇，另选3篇，不重复计入上轮已完成3篇。');para(changes,'20份PDF SHA-256与60处短摘录已检查；字段和字符串匹配不保证中文解读正确。基线代码仅静态核对，未运行。');app.append(changes);
}
function paper(p){app.replaceChildren(button('← 返回定位与20篇',home),el('h2',p.name));link(app,'打开原始PDF',p.source);para(app,p.venue+'；'+p.code_status,'muted');const grid=el('div',undefined,'keys');for(const k of p.keys){const c=el('article',undefined,'key');c.append(el('h3',k.key));para(c,k.text);para(c,'PDF第'+k.pages.join('、')+'页','muted');grid.append(c);}app.append(grid);app.append(el('h2','原文定位'));for(const a of p.anchors){para(app,'PDF第'+a.page+'页','muted');app.append(el('q',a.needle));}app.append(el('h2','理解题'));para(app,p.quiz.question);const d=el('details');d.append(el('summary','展开助手自答与自检'));para(d,p.quiz.answer);para(d,p.quiz.self_check,'muted');app.append(d);app.append(el('h2','研究复盘'));para(app,p.reflection);para(app,'尚未执行的实验：'+p.next_experiment);const meta=el('details');meta.append(el('summary','阅读范围与来源指纹'));para(meta,p.read_scope);para(meta,'已读PDF页：'+p.read_pages.join('、'));meta.append(el('code',p.source_sha256));app.append(meta);window.scrollTo(0,0);}
fetch('assets/research20/increment20.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(d=>{if(d.schema!==1||d.papers?.length!==20)throw Error('format');pack=d;app.removeAttribute('role');home();}).catch(()=>{app.replaceChildren(el('p','档案未加载。请用本地HTTP入口打开；顶部JSON可用于检查文件。'));});
</script><script type="application/qiyaoji-deferred" src="/model-ui.js"></script><script type="application/qiyaoji-deferred" src="/customer-shell.js"></script><script type="application/qiyaoji-deferred" src="/guided-study.js"></script><script type="application/qiyaoji-deferred" src="/realm.js"></script><script type="application/qiyaoji-deferred" src="/expedition.js"></script><script type="application/qiyaoji-deferred" src="/workspace.js"></script><script type="application/qiyaoji-deferred" src="/voices.js"></script><script type="application/qiyaoji-deferred" src="/entrance.js"></script><script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script><script src="/customer-config.js"></script><script src="/customer-boot.js"></script></body></html>
