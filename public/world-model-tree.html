<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七钥纪 · 世界模型知识大树</title>
<style>
:root{color-scheme:dark;font:16px system-ui,'Microsoft YaHei',sans-serif;background:#091b28;color:#dce8ed}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:28px 24px}a{color:#92dbd7}h1,h2,h3{color:#e4c68e}p{line-height:1.8}.muted{color:#aac2ce;font-size:14px}nav,.tools,.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;color:inherit;background:#123445;border:1px solid #46697b;border-radius:6px;padding:10px 14px}button{cursor:pointer}button[aria-pressed=true]{background:#335b62;border-color:#e4c68e}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e4c68e;outline-offset:3px}.stats span{padding:8px 16px;background:#123445}.tree{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin:24px 0}.branch{border-top:2px solid #6d9997;position:relative}.branch:before{content:'';position:absolute;left:50%;top:-17px;height:16px;border-left:1px solid #6d9997}.branch h3{font-size:17px}.branch button{display:block;text-align:left;width:100%;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:26px}.paper{padding:14px 0;border-bottom:1px solid #365565}.paper h3{margin:6px 0}.badge{font-size:13px;color:#9ed9ca}.key{border-bottom:1px solid #365565;padding:8px 0}details{margin:14px 0}summary{cursor:pointer;padding:8px 0}aside{background:#0d2938;padding:20px;align-self:start;position:sticky;top:12px;max-height:85vh;overflow:auto}.root{text-align:center;max-width:700px;margin:24px auto;border-bottom:1px solid #6d9997;padding-bottom:18px}.path{color:#a5d6ce}.notice{padding:16px;background:#173747;border-left:3px solid #e4c68e}input{min-width:240px;flex:1}#list{max-height:80vh;overflow:auto;padding-right:10px}@media(max-width:1000px){.tree{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){main{padding:18px 14px}.tree{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}aside{position:static;max-height:none}#list{max-height:none}.root{text-align:left}}
</style><main><nav><a href="index.html">学习工作台</a><a href="research-progress.html">推进看板</a><a href="research-increment20.html">新增20篇</a></nav><p class="muted">QIYAOJI · WORLD MODEL RESEARCH ATLAS</p><h1>世界模型知识大树</h1><p>从“世界如何被看见”，走向“哪些预测真正帮助决策”。</p><div id="app" role="status">正在读取已核验档案…</div></main>
<script type="application/qiyaoji-deferred">
'use strict';
const E=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const app=document.getElementById('app');let data,active='',query='',mode='papers';
const link=(parent,text,url)=>{try{const u=new URL(url,location.href);if(!['https:','http:'].includes(u.protocol))return;const a=E('a',text);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);}catch{}};
function start(){app.replaceChildren();app.removeAttribute('role');const stats=E('div',undefined,'stats');for(const t of [`${data.audit.papers}篇精读已归位`,`主文审读 ${data.audit.surveys_read}/${data.audit.surveys_target}（含立场文章）`,`相关章节 ${data.surveys.filter(s=>s.status==='related_sections_read').length}篇`,`全文待获取 ${data.surveys.filter(s=>s.status==='source_blocked').length}篇`,`0卡时 · 本地档案`])stats.append(E('span',t));app.append(stats,E('p',data.disclaimer,'notice'));
 const root=E('div',undefined,'root');root.append(E('h2','观测历史 + 候选动作 → 未来分布/表示 → 决策用途'),E('p','输入可以是像素、深度、点云、本体或触觉；状态表示不等于世界的物质组成。','muted'));app.append(root);const guide=E('details');guide.append(E('summary','从哪里开始：适合 CV / VLA 基础的阅读路径'),E('p','任务相关抽象 → 潜空间预测 → 动作条件动力学 → MPC或动作读出 → 排序与不确定性 → 等预算闭环验证。每一步都能退回检查观测信息、表示、动力学或规划器。'),E('p','宏观与“骡”：群体规律 → 个体隐藏信念 → 异常干预 → 尾部风险 → 反馈修正。这是待验证的问题链，不是已完成的心理史学模型。','path'));app.append(guide);
 const tree=E('div',undefined,'tree');tree.setAttribute('aria-label','概念层级与论文节点');for(const b of data.branches){const col=E('section',undefined,'branch');col.append(E('h3',b.label));for(const n of b.children){const count=data.papers.filter(p=>p.nodes.includes(n.id)).length;const btn=E('button',`${n.label} · ${count}`);btn.type='button';btn.setAttribute('aria-pressed',String(active===n.id));btn.onclick=()=>{active=active===n.id?'':n.id;mode='papers';render();};btn.dataset.node=n.id;col.append(btn);}tree.append(col);}app.append(tree);
 const tools=E('div',undefined,'tools'),input=E('input');input.type='search';input.placeholder='搜索论文名、七钥或边界';input.setAttribute('aria-label','搜索精读论文');input.oninput=()=>{query=input.value.toLowerCase();render();};tools.append(input);for(const [m,t] of [['papers','精读论文'],['surveys','全部综述与核验状态']]){const b=E('button',t);b.type='button';b.onclick=()=>{mode=m;render();};tools.append(b);}const reset=E('button','全部节点');reset.type='button';reset.onclick=()=>{active='';query='';input.value='';mode='papers';render();};tools.append(reset);const refresh=E('button','刷新审读进度');refresh.type='button';refresh.onclick=()=>location.reload();tools.append(refresh);app.append(tools);
 const layout=E('div',undefined,'layout'),left=E('section'),title=E('h2');title.id='view-title';left.append(title);const list=E('div');list.id='list';left.append(list);const detail=E('aside');detail.id='detail';detail.setAttribute('aria-live','polite');detail.append(E('h2','点击论文，打开七钥证据'),E('p','同一论文可落在多个节点。主节点表示本次阅读的主要问题，跨节点表示关联，不强行归入单一路线。'));layout.append(left,detail);app.append(layout);render();}
function label(id){for(const b of data.branches){const n=b.children.find(n=>n.id===id);if(n)return n;}return {label:id,question:''};}
function render(){for(const b of app.querySelectorAll('[data-node]'))b.setAttribute('aria-pressed',String(b.dataset.node===active));const list=document.getElementById('list');list.replaceChildren();document.getElementById('view-title').textContent=mode==='surveys'?'综述：全文、部分与来源问题逐条区分':active?label(active).label:'全部已精读研究论文';
 if(mode==='surveys'){for(const s of data.surveys.filter(s=>(!active||(s.nodes||[]).includes(active))&&(!query||JSON.stringify(s).toLowerCase().includes(query)))){const c=E('article',undefined,'paper');c.append(E('span',s.status==='main_read'?'主文审读完成':s.status==='related_sections_read'?'相关章节已读 · 不计全书全文':s.status==='partial_read'?'部分审读 · 不计全文完成':s.status==='source_blocked'?'全文待获取 · 摘要不计精读':'全文已取得 · 待审读','badge'),E('h3',s.cn||s.full));if(s.correction)c.append(E('p',s.correction));link(c,'原始来源',s.verified_source||s.link);if(s.summary)c.append(E('p',s.summary));if(s.read_scope)c.append(E('p',s.read_scope,'muted'));if(s.read_pages)c.append(E('p','已读PDF页：'+s.read_pages.join('、'),'muted'));const notes=E('details');notes.append(E('summary','分类依据 · 批判性核对 · 对大树的修改'));for(const [key,title] of [['taxonomy','综述的分类轴'],['boundary','证据边界与疑点'],['tree_changes','如何修正大树']])if(s[key])notes.append(E('h3',title),E('p',s[key]));if(s.nodes)notes.append(E('p','对应节点：'+s.nodes.map(n=>label(n).label).join(' ↔ '),'path'));for(const a of s.anchors||[])notes.append(E('p',`原文定位 p${a.page} · ${a.needle}`,'muted'));if(s.source_sha256)notes.append(E('p','来源指纹 '+s.source_sha256.slice(0,16),'muted'));c.append(notes);list.append(c);}return;}
 if(active)list.append(E('p',label(active).question,'path'));const papers=data.papers.filter(p=>(!active||p.nodes.includes(active))&&JSON.stringify([p.name,p.keys,p.reflection]).toLowerCase().includes(query));for(const p of papers){const c=E('article',undefined,'paper');c.append(E('span',p.id+' · 主节点 '+label(p.nodes[0]).label,'badge'),E('h3',p.name),E('p',p.nodes.slice(1).map(n=>label(n).label).join(' ↔ '),'muted'));const b=E('button','七钥 · 证据 · 边界');b.type='button';b.onclick=()=>show(p);c.append(b);list.append(c);}if(!papers.length)list.append(E('p','没有匹配论文；空节点是证据缺口，不代表领域无人研究。'));}
function show(p){const d=document.getElementById('detail');d.replaceChildren(E('h2',p.name),E('p',p.nodes.map(n=>label(n).label).join(' ↔ '),'path'));link(d,'原始论文',p.source);d.append(E('p',p.read_scope,'muted'));for(const k of p.keys){const s=E('section',undefined,'key');s.append(E('h3',k.key),E('p',k.text),E('p','PDF页 '+k.pages.join('、'),'muted'));d.append(s);}const a=E('details');a.append(E('summary','原文定位与理解自答'));for(const x of p.anchors)a.append(E('p',`p${x.page} · ${x.needle}`));a.append(E('h3',p.quiz.question),E('p',p.quiz.answer));d.append(a,E('h3','阅读后修正'),E('p',p.reflection));d.scrollTop=0;}
fetch('assets/research20/world-tree.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json();}).then(d=>{if(d.schema!==1)throw Error('schema');data=d;start();}).catch(e=>app.textContent='档案未加载，请通过本地HTTP入口打开。');
</script></html>
